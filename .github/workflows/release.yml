name: Build and publish Android release

# 打 v* tag 自动发布；也可以在 Actions 页面手动填 tag 触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布的 tag（必须与 build.gradle.kts 的 versionName 一致）
        required: true
        default: v1.1.38

permissions:
  contents: write

# 同一个 tag 重复触发时排队，不并发跑两份
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle 发行包与依赖。首跑要下 gradle-8.11.1-bin.zip（约 130MB）
      # 加全部依赖，之后命中缓存能省掉大半时间
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 不用 android-actions/setup-android：它在 runner 上被强制跑在 Node 24，
      # 7 秒内直接失败、且不给任何错误注解。GitHub 的 ubuntu 镜像本来就带 SDK，
      # 这里只用命令行工具补齐本工程需要的包：compileSdk 36 + SDK 扩展 19。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK/platforms" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36-ext19" \
            "build-tools;36.0.0"

      # 防呆：tag 与 versionName 必须对得上。
      # v1.1.34 那次就是 tag 叫 1.1.34、代码里写着别的版本，发出去的包和号对不上。
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=${TAG} versionName=${NAME} versionCode=${CODE}"
          if [ -z "${NAME}" ] || [ -z "${CODE}" ]; then
            echo "::error::没能从 app/build.gradle.kts 里读出 versionName / versionCode"
            exit 1
          fi
          if [ "v${NAME}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} 与 build.gradle.kts 的 versionName ${NAME} 不一致，请先统一版本号"
            exit 1
          fi

      # 固定签名：私钥不入库，CI 从 Secrets 还原出同一份 keystore。
      # 缺 Secret 时直接失败，不能让 Gradle 静默退回「每次都变」的 debug 签名。
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少仓库 Secret: ${name}（配置方式见 README「签名」一节）"
              exit 1
            fi
          done
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > signing/release.jks
          chmod 600 signing/release.jks
          # 先验证 Secret 内容自洽：密码或别名不对就立刻失败，别等 R8 跑完才报错
          if ! keytool -list -keystore signing/release.jks \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::还原的 keystore 与 RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS 不匹配"
            exit 1
          fi
          echo "keystore restored: $(wc -c < signing/release.jks) bytes"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        env:
          WKN_KEYSTORE_FILE: signing/release.jks
          WKN_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          WKN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # 只靠「构建没报错」不够：Secret 配错时 Gradle 会退回 debug 签名照样出包。
      # 直接比证书指纹，确保发出去的每个版本都是同一把钥匙。
      - name: Verify release certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          INFO=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$INFO" | grep -E 'Signer #1 certificate (DN|SHA-256 digest)'
          ACTUAL=$(echo "$INFO" | sed -n 's/.*Signer #1 certificate SHA-256 digest: \([0-9a-fA-F]*\).*/\1/p' | head -1 | tr 'A-F' 'a-f')
          # signing/release.jks 的证书指纹（2026-11-15 生成）。换 keystore 时必须同步改这里。
          EXPECTED=462c41a36e26bdcbfc0531451539d42d4c966cced10290687f47ebe8ef9dace5
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 证书指纹不匹配（实际 ${ACTUAL:-空}），可能 Secret 缺失导致退回了 debug 签名"
            exit 1
          fi
          echo "签名证书固定：${ACTUAL}"

      - name: Show APK
        run: ls -l app/build/outputs/apk/release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
