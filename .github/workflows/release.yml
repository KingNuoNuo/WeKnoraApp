name: Build and publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        default: v1.1.34

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它在 runner 上被强制跑在 Node 24，
      # 7 秒内直接失败、且不给任何错误注解。GitHub 的 ubuntu 镜像本来就带 SDK，
      # 这里只用命令行工具补齐本工程需要的包：compileSdk 36 + SDK 扩展 19。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK/platforms" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36-ext19" \
            "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Show APK
        run: ls -l app/build/outputs/apk/release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
